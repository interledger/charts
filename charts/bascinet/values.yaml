backend:
  name: backend
  enabled: true
  replicaCount: 2
  # Vanilla key/value pairs rendered as-is into this deployment's ConfigMap data.
  config:
    SOME_ENV: "somevalue"
  serviceAccount: {}
    # create: false
    # name: "webksa"
  # imagePullPolicy: IfNotPresent
  service:
    http:
      name: backend-http
      type: ClusterIP
      ports:
        - port: 80
          targetPort: http
          protocol: TCP
          name: http
      annotations: {}
  image:
    repository: ghcr.io/interledger/somerepo
    name: web
    tag: 2.0.0
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 2048Mi
      cpu: 1000m
  initContainers: []
  sidecars: []
  env: []
  envFrom:
    - configMapRef:
        name: "{{ include \"common.fullname\" . }}-{{ .Values.backend.name }}"
  # command: []
  # args: []
  # livenessProbe: {}
  # readinessProbe: {}
  # volumeMounts: []
  # securityContext: {}

